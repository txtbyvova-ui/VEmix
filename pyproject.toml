[project]
name = "veg-mixer"
version = "3.0.0"
description = "VEgroove Automix / VEmix 3.0: loudness-normalized playlists, continuous mixes and scenario-driven dramaturgical planning"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: integration test that runs the real ffmpeg/ffprobe binaries",
    "slow: longer-running integration test",
]
addopts = "-ra"
